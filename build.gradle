plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id "com.gradleup.shadow" version "9.0.0-beta12"
}

group = 'com.magmaguy'
version = '2.7.8'

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven { url = 'https://repo.magmaguy.com/releases' }
    maven { url = "https://repo.magmaguy.com/snapshots" }
    maven { url = 'https://repo.codemc.org/repository/maven-public' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven { url = 'https://nexus.phoenixdevt.fr/repository/maven-public/' }
    maven { url = 'https://mvn.lumine.io/repository/maven-public/' }
}

dependencies {
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    compileOnly 'org.projectlombok:lombok:1.18.30'

    implementation (group: 'com.magmaguy', name: 'MagmaCore', version: '2.2.0-SNAPSHOT'){
        changing = true
    }
    implementation group: 'org.bstats', name: 'bstats-bukkit', version: '3.0.2'
    implementation group: 'org.joml', name: 'joml', version: '1.10.8'
    compileOnly group: 'com.magmaguy', name: 'EliteMobs', version: '10.9.7'
    compileOnly group: 'io.lumine', name: 'Mythic-Dist', version: '5.2.1'
    compileOnly group: 'io.lumine', name: 'MythicLib-dist', version: '1.5.2-SNAPSHOT'
    compileOnly group: 'net.Indyuce', name: 'MMOItems-API', version: '6.9.2-SNAPSHOT'
    compileOnly group: 'com.sk89q.worldguard', name: 'worldguard-bukkit', version: '7.0.7'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.4.2'
    compileOnly 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'
    //The server's logging backend, used only to collapse the per-block conversion errors Mojang's
    //data converter emits while reading schematics (see SchematicConversionLog). compileOnly: the
    //server always provides it, and a runtime without it degrades to the original output.
    compileOnly 'org.apache.logging.log4j:log4j-core:2.24.1'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v26.2:4.116.1'
    testImplementation 'io.papermc.paper:paper-api:26.2.build.111-stable'
    // The cache ticket test exercises the production Clipboard seam without starting Bukkit.
    testImplementation 'com.sk89q.worldedit:worldedit-core:7.4.2'
    testImplementation 'com.sk89q.worldedit:worldedit-bukkit:7.4.2'
    testImplementation('com.magmaguy:EliteMobs:10.9.7') {
        changing = true
        exclude group: 'org.spigotmc', module: 'spigot-api'
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Bukkit/Paper supplies these libraries. WorldEdit's strict pins describe its server baseline,
    // which differs from the selected API version; retain the server's dependency declarations.
    components {
        ['worldedit-core', 'worldedit-bukkit'].each { module ->
            withModule("com.sk89q.worldedit:${module}") {
                allVariants {
                    withDependencyConstraints {
                        removeAll { it.group in ['com.google.guava', 'com.google.code.gson'] }
                    }
                    withDependencies {
                        removeAll { it.group in ['com.google.guava', 'com.google.code.gson'] }
                    }
                }
            }
        }
    }
}

//This allows any modules tagged as changing to be updated every time, which is extremely convenient for some of the shaded libs
configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

artifacts { // task 'build' runs generates uberjar
    archives shadowJar
}

jar {
    archiveVersion.set('') // Local outputs replace the previous build; Maven coordinates keep project.version.
    archiveClassifier.set('min') // we want the Uberjar to be distributed, this is the minified version
}

String packagePath = 'com.magmaguy.shaded'

// Relocating a Package
shadowJar {
    dependencies {
        relocate('org.bstats', packagePath + '.bstats')
    }
    relocate 'com.magmaguy.easyminecraftgoals', 'com.magmaguy.betterstructures.easyminecraftgoals'
    // Relocate the shaded MagmaCore so its static singleton (and config-folder resolution via
    // MagmaCore.getInstance().getRequestingPlugin()) is isolated per plugin. Without this, every
    // plugin that ships MagmaCore unrelocated shares one instance/requestingPlugin, so their
    // configs (e.g. setupDone) collide in a single data folder and never persist per-plugin.
    relocate 'com.magmaguy.magmacore', 'com.magmaguy.betterstructures.magmacore'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveClassifier.set(null)
    archiveFileName.set(project.name + ".jar")
}

// --- Shared dist mirror -----------------------------------------------------
// Copy the finished shaded jar into the top-level dist/ folder so the testbeds
// and the release tool pick every build up from one place. Gated on MC_DIST_DIR
// (or -PmcDistDir) so clones/CI that don't set it just build to build/libs and
// no machine-specific path is ever committed.
def mcDistDir = System.getenv('MC_DIST_DIR') ?: project.findProperty('mcDistDir')
if (mcDistDir) {
    tasks.register('mirrorToDist', Copy) {
        from tasks.named('shadowJar')
        into mcDistDir
    }
    tasks.named('shadowJar') { finalizedBy('mirrorToDist') }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

// Production stays on Java 21; the Paper 26.2 test server requires Java 25.
configurations.matching { it.name in ['testCompileClasspath', 'testRuntimeClasspath'] }.configureEach {
    attributes.attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
}
tasks.named('compileTestJava', JavaCompile) {
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
}

ext {
    resourceTokens = [
            'Version': version
    ]
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21) // or your target version
    }
}

processResources {
    filter org.apache.tools.ant.filters.ReplaceTokens, tokens: resourceTokens
}

publishing {
    repositories {
        maven {
            name = "BetterStructures"
            url = "https://repo.magmaguy.com/releases"
            credentials {
                username = project.findProperty('magmaguyUsername') ?: System.getenv('MAGMAGUY_USERNAME') ?: ''
                password = project.findProperty('magmaguyPassword') ?: System.getenv('MAGMAGUY_PASSWORD') ?: ''
            }
        }
    }

    publications {
        mavenJava(MavenPublication) {
            pom {
                groupId = 'com.magmaguy'
                name = 'betterstructures'
                description = 'BetterStructures repo'
                url = 'https://magmaguy.com/'
                from components.java
                licenses {
                    license {
                        name = 'GPLV3'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.en.html'
                    }
                }
            }
        }
    }
}
